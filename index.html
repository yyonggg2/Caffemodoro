<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caffemodoro</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="Assets/latte_transparent.png" />
  </head>
  <body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="blob blob-5"></div>
    <div class="blob blob-6"></div>
    <div class="blob blob-7"></div>
    <div class="blob blob-8"></div>

    <svg style="position: absolute; width: 0; height: 0">
      <filter id="watercolor">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.012"
          numOctaves="4"
          result="noise"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="noise"
          scale="40"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>

    <div id="app">
      <div id="menu">
        <div id="menu-content"></div>
      </div>
      <div id="server">
        <div id="server-speech">
          <div id="server-speech-text">
            Welcome! Put your mouse on the menu for a drink that you are
            interested in! Click a drink to select it~
          </div>
          <div id="server-actions">
            <button id="yes-btn" type="button">Yes</button>
            <button id="no-btn" type="button">No</button>
          </div>
        </div>

      <div id="drink-page">
        <img id="drink-image" src="" alt="" />
        <div id="drink-timer"></div>
        <button id="back-to-menu-btn" type="button">
          <div class="top">← Back</div>
          <div class="bottom"></div>
        </button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
